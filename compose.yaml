# OpenCortyx stack. Use `bin/opencortyx up` (or `docker compose up -d`).
# Configuration lives in .env (created by `bin/opencortyx init`).
name: opencortyx

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Built (and pulled) by the `api` service only. The other services run the same image with
# `pull_policy: never`: giving each its own `build:` made `up --build` build it five times at once,
# and the copies then failed to export under the one tag ("image ... already exists").
x-api-build: &api-build
  context: ./apps/api
  args:
    INSTALL_RERANK: ${INSTALL_RERANK:-0}

x-api-image: &api-image ${OPENCORTYX_IMAGE_PREFIX:-ghcr.io/opencortyx/opencortyx}-api:${OPENCORTYX_VERSION:-dev}

x-api-env: &api-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-opencortyx}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run bin/opencortyx init}@postgres:5432/${POSTGRES_DB:-opencortyx}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  VECTOR_STORE_PROVIDER: ${VECTOR_STORE_PROVIDER:-qdrant}
  QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-opencortyx}
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  GRAPH_STORE_PROVIDER: ${GRAPH_STORE_PROVIDER:-nebulagraph}
  NEBULA_HOST: ${NEBULA_HOST:-nebulagraph}
  NEBULA_PORT: ${NEBULA_PORT:-9669}
  NEBULA_USER: ${NEBULA_USER:-root}
  NEBULA_PASSWORD: ${NEBULA_PASSWORD:-nebula}
  NEBULA_SPACE: ${NEBULA_SPACE:-opencortyx}
  CORS_ORIGINS: '["${PUBLIC_WEB_URL:-http://localhost:3000}"]'
  # Which models run is set on the Models page (the Model Registry), not here. This is only the
  # context window assumed when a model server does not report its own.
  LLM_MAX_MODEL_LEN: ${LLM_MAX_MODEL_LEN:-8192}
  EMBED_DIMENSIONS: ${EMBED_DIMENSIONS:-768}
  RATELIMIT_HEAVY_PER_MIN: ${RATELIMIT_HEAVY_PER_MIN:-30}
  GROUNDING_EMBED_BATCH: ${GROUNDING_EMBED_BATCH:-4}
  GROUNDING_MAX_BLOCK_CHARS: ${GROUNDING_MAX_BLOCK_CHARS:-6000}
  GROUNDING_MAX_BLOCKS: ${GROUNDING_MAX_BLOCKS:-60}
  RETRIEVAL_INCLUDE_CITATIONS: ${RETRIEVAL_INCLUDE_CITATIONS:-false}
  RETRIEVAL_WORKFLOW_CACHE: ${RETRIEVAL_WORKFLOW_CACHE:-false}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
  JWT_ALGORITHM: HS256
  HF_HOME: /cache/huggingface
  LOCAL_FS_HOST_ROOT: ${OPENCORTYX_FILES_ROOT:-}
  LOCAL_FS_MOUNT: /host
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-api-volumes: &api-volumes
  - model_cache:/cache
  # Uploaded files wait here for their worker; the queue carries a reference (core/uploads.py).
  - uploads:/data/uploads
  - ${OPENCORTYX_FILES_ROOT:-./data/files}:/host:ro

x-after-setup: &after-setup
  setup:
    condition: service_completed_successfully
  redis:
    condition: service_healthy
  qdrant:
    condition: service_healthy
  nebulagraph:
    condition: service_healthy

x-worker-healthcheck: &worker-healthcheck
  test: ["CMD-SHELL", "celery -A opencortyx.core.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 >/dev/null 2>&1 || exit 1"]
  interval: 60s
  timeout: 15s
  retries: 3
  start_period: 120s

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *logging
    mem_limit: ${POSTGRES_MEM_LIMIT:-1024m}
    memswap_limit: ${POSTGRES_MEM_LIMIT:-1024m}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opencortyx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run bin/opencortyx init}
      POSTGRES_DB: ${POSTGRES_DB:-opencortyx}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:${OPENCORTYX_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: ${REDIS_MEM_LIMIT:-192m}
    memswap_limit: ${REDIS_MEM_LIMIT:-192m}
    # Configured as the job queue it is. `maxmemory` below the container limit with `noeviction`:
    # when full, Redis refuses new jobs with an error instead of being killed by the kernel or
    # silently dropping queued ones. `appendonly`: the queue survives a restart (written every second).
    command: >-
      redis-server --maxmemory ${REDIS_MAXMEMORY:-128mb} --maxmemory-policy noeviction
      --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    logging: *logging
    # Vectors live on disk with an int8 copy in memory: ~450 MB at rest for a thousand files (544,000
    # points). Rewriting a collection into that layout peaked at 1.33 GB and stalled at a 1 GB limit.
    mem_limit: ${QDRANT_MEM_LIMIT:-1536m}
    memswap_limit: ${QDRANT_MEM_LIMIT:-1536m}
    ports:
      - "127.0.0.1:${OPENCORTYX_QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10

  nebula-metad:
    image: vesoft/nebula-metad:v3.8.0
    restart: unless-stopped
    logging: *logging
    mem_limit: ${NEBULA_METAD_MEM_LIMIT:-512m}
    memswap_limit: ${NEBULA_METAD_MEM_LIMIT:-512m}
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-metad
      # Judge memory against this container's own limit (cgroup), not the whole machine: by
      # default it refused queries once the Docker VM was 80% full, failing uploads that
      # had plenty of room in the graph store itself.
      - --containerized=true
      - --ws_ip=nebula-metad
      - --port=9559
      - --ws_http_port=19559
      - --data_path=/data/meta
      - --logtostderr=true
    volumes:
      - nebula_meta_data:/data/meta
    healthcheck:
      test: ["CMD-SHELL", "cat < /dev/null > /dev/tcp/localhost/9559"]
      interval: 5s
      timeout: 3s
      retries: 20

  nebula-storaged:
    image: vesoft/nebula-storaged:v3.8.0
    restart: unless-stopped
    logging: *logging
    # RocksDB is sized to fit: its index and filter blocks live in a bounded block cache instead of
    # growing with the data, and the write buffers are smaller. With the defaults it climbed past
    # 1 GB as a 1000-document graph grew and was killed every few minutes, failing uploads in flight.
    mem_limit: ${NEBULA_STORAGED_MEM_LIMIT:-2048m}
    memswap_limit: ${NEBULA_STORAGED_MEM_LIMIT:-2048m}
    depends_on:
      nebula-metad:
        condition: service_healthy
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-storaged
      - --containerized=true
      - --enable_partitioned_index_filter=true
      - --rocksdb_block_cache=256
      - '--rocksdb_column_family_options={"write_buffer_size":"33554432","max_write_buffer_number":"2","max_bytes_for_level_base":"268435456"}'
      - --ws_ip=nebula-storaged
      - --port=9779
      - --ws_http_port=19779
      - --data_path=/data/storage
      - --logtostderr=true
    volumes:
      - nebula_storage_data:/data/storage
    healthcheck:
      test: ["CMD-SHELL", "cat < /dev/null > /dev/tcp/localhost/9779"]
      interval: 5s
      timeout: 3s
      retries: 20

  nebulagraph:
    image: vesoft/nebula-graphd:v3.8.0
    restart: unless-stopped
    logging: *logging
    # The query service refuses work at 80% of this. Retrieval's queries come and go in bursts of a
    # few hundred MB, and two at once passed 800 MB of a 1 GB limit while scoring 1000 questions.
    mem_limit: ${NEBULAGRAPH_MEM_LIMIT:-1536m}
    memswap_limit: ${NEBULAGRAPH_MEM_LIMIT:-1536m}
    depends_on:
      nebula-metad:
        condition: service_healthy
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebulagraph
      - --containerized=true
      - --ws_ip=nebulagraph
      - --port=9669
      - --ws_http_port=19669
      - --logtostderr=true
      # Sessions a process never signed out of (a SIGKILLed or recycled worker child) are reclaimed
      # after this long instead of graphd's 8-hour default. At 300 sessions per client IP graphd
      # refuses new ones, and every graph read and write in that container fails until they expire.
      - --session_idle_timeout_secs=600
    ports:
      - "127.0.0.1:${OPENCORTYX_NEBULA_PORT:-9669}:9669"
    healthcheck:
      test: ["CMD-SHELL", "cat < /dev/null > /dev/tcp/localhost/9669"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot setup, run on every start: the graph store (space, schema, indexes), the vector store
  # (collection, indexes), then the database (tables, `alembic upgrade head`) — one script,
  # `opencortyx/setup.py`, which says why each step comes where it does. Every API and worker
  # container waits for it to exit 0. Idempotent: on a current install it only checks.
  #
  # It waits for graphd, never for storaged. NebulaGraph 3.x does not register a storage host by
  # itself: until `ADD HOSTS` names it, storaged never opens 9779, so its healthcheck can never pass.
  # The graph step issues that registration (the adapter's own bootstrap, not a copy of the
  # statement here) and then waits for storage itself. Waiting on storaged deadlocked first installs.
  setup:
    image: *api-image
    pull_policy: never        # the image `api` builds or pulls
    restart: "no"
    logging: *logging
    mem_limit: ${SETUP_MEM_LIMIT:-768m}
    memswap_limit: ${SETUP_MEM_LIMIT:-768m}
    command: python -m opencortyx.setup
    env_file: .env
    environment:
      <<: *api-env
    volumes:
      - model_cache:/cache
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      nebulagraph:
        condition: service_healthy

  api:
    build: *api-build
    image: *api-image
    restart: unless-stopped
    logging: *logging
    # Embedding model plus retrieval working memory reach ~1.8 GiB under load.
    mem_limit: ${API_MEM_LIMIT:-4096m}
    memswap_limit: ${API_MEM_LIMIT:-4096m}
    command: uvicorn opencortyx.main:app --host 0.0.0.0 --port 8000 --loop asyncio
    ports:
      - "${OPENCORTYX_BIND:-127.0.0.1}:${OPENCORTYX_API_PORT:-8000}:8000"
    env_file: .env
    environment:
      <<: *api-env
    depends_on: *after-setup
    volumes: *api-volumes
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    image: *api-image
    pull_policy: never        # the image `api` builds or pulls
    restart: unless-stopped
    # A stopped worker hands its running jobs back to the queue at once (Celery soft shutdown, see
    # celery_app.py) instead of leaving them unacknowledged until the broker's 40-minute timeout.
    # `exec` below matters as much: without it `sh` is the process Docker signals, it does not pass
    # the signal on, and Celery was killed after the grace period every time, mid-job.
    stop_signal: SIGQUIT
    stop_grace_period: 30s
    logging: *logging
    # Ingestion embeds in-process, so a child holds the embedding model (~1.2 GiB resident).
    # Reads uploaded files (layout/readers/; LibreOffice converts legacy office files); 1664m could not hold them
    # beside the pool parent and beat, and a PDF OOM-killed the child on every attempt.
    mem_limit: ${WORKER_MEM_LIMIT:-3072m}
    memswap_limit: ${WORKER_MEM_LIMIT:-3072m}
    # One child by default, and a recycle threshold ABOVE the model it holds: a lower threshold
    # recycles the child DURING an ingest, and because tasks are acked late the broker redelivers
    # the task and it starts over — a folder sync that never finishes. Raise the concurrency only
    # with the memory limit.
    command: sh -c 'exec celery -A opencortyx.core.worker.celery_app worker -B --loglevel=info --concurrency=${CELERY_WORKER_CONCURRENCY:-1} --queues=graphrag --max-memory-per-child=${CELERY_WORKER_MAX_MEMORY_KB:-1500000} --max-tasks-per-child=200'
    healthcheck: *worker-healthcheck
    env_file: .env
    environment:
      <<: *api-env
      PROMETHEUS_MULTIPROC_DIR: /tmp/prom
      METRICS_PORT: "9101"
      OCX_SERVICE: worker
    depends_on: *after-setup
    volumes: *api-volumes
    extra_hosts:
      - "host.docker.internal:host-gateway"

  extraction-worker:
    image: *api-image
    pull_policy: never        # the image `api` builds or pulls
    restart: unless-stopped
    # A stopped worker hands its running jobs back to the queue at once (Celery soft shutdown, see
    # celery_app.py) instead of leaving them unacknowledged until the broker's 40-minute timeout.
    # `exec` below matters as much: without it `sh` is the process Docker signals, it does not pass
    # the signal on, and Celery was killed after the grace period every time, mid-job.
    stop_signal: SIGQUIT
    stop_grace_period: 30s
    logging: *logging
    # Entity resolution embeds in-process, so extraction holds the embedding model (~1.2 GiB peak).
    mem_limit: ${EXTRACTION_WORKER_MEM_LIMIT:-3200m}
    memswap_limit: ${EXTRACTION_WORKER_MEM_LIMIT:-3200m}
    command: sh -c 'exec celery -A opencortyx.core.worker.celery_app worker --loglevel=info --concurrency=${EXTRACTION_WORKER_CONCURRENCY:-1} --queues=extraction --max-memory-per-child=${EXTRACTION_WORKER_MAX_MEMORY_KB:-2500000} --max-tasks-per-child=200'
    healthcheck: *worker-healthcheck
    env_file: .env
    environment:
      <<: *api-env
      PROMETHEUS_MULTIPROC_DIR: /tmp/prom
      METRICS_PORT: "9102"
      OCX_SERVICE: extraction-worker
    depends_on: *after-setup
    volumes: *api-volumes
    extra_hosts:
      - "host.docker.internal:host-gateway"

  maintenance-worker:
    image: *api-image
    pull_policy: never        # the image `api` builds or pulls
    restart: unless-stopped
    # A stopped worker hands its running jobs back to the queue at once (Celery soft shutdown, see
    # celery_app.py) instead of leaving them unacknowledged until the broker's 40-minute timeout.
    # `exec` below matters as much: without it `sh` is the process Docker signals, it does not pass
    # the signal on, and Celery was killed after the grace period every time, mid-job.
    stop_signal: SIGQUIT
    stop_grace_period: 30s
    logging: *logging
    mem_limit: ${MAINTENANCE_WORKER_MEM_LIMIT:-832m}
    memswap_limit: ${MAINTENANCE_WORKER_MEM_LIMIT:-832m}
    command: sh -c 'exec celery -A opencortyx.core.worker.celery_app worker --loglevel=info --concurrency=1 --queues=maintenance --max-memory-per-child=${MAINTENANCE_WORKER_MAX_MEMORY_KB:-300000} --max-tasks-per-child=100'
    healthcheck: *worker-healthcheck
    env_file: .env
    environment:
      <<: *api-env
      PROMETHEUS_MULTIPROC_DIR: /tmp/prom
      METRICS_PORT: "9104"
      OCX_SERVICE: maintenance-worker
    depends_on: *after-setup
    volumes: *api-volumes
    extra_hosts:
      - "host.docker.internal:host-gateway"

  embedding-worker:
    image: *api-image
    pull_policy: never        # the image `api` builds or pulls
    restart: unless-stopped
    # A stopped worker hands its running jobs back to the queue at once (Celery soft shutdown, see
    # celery_app.py) instead of leaving them unacknowledged until the broker's 40-minute timeout.
    # `exec` below matters as much: without it `sh` is the process Docker signals, it does not pass
    # the signal on, and Celery was killed after the grace period every time, mid-job.
    stop_signal: SIGQUIT
    stop_grace_period: 30s
    logging: *logging
    # The embedding model is resident here by design; measured at ~1.35 GiB under a batch.
    # One process holds the one resident model; embeddings and resolution take turns in it. It was two
    # threads side by side, but Celery cannot cancel a thread, so a stopped worker could not hand its
    # job back (soft shutdown) and the job sat unacknowledged for 40 minutes. The child is recycled
    # (between jobs, never during one) once a large batch has grown it past 1.5 GB; the next job
    # reloads the model from the cache in seconds.
    mem_limit: ${EMBEDDING_WORKER_MEM_LIMIT:-2304m}
    memswap_limit: ${EMBEDDING_WORKER_MEM_LIMIT:-2304m}
    command: sh -c 'exec celery -A opencortyx.core.worker.celery_app worker --loglevel=info --pool=prefork --concurrency=1 --queues=embedding,resolution --max-memory-per-child=${EMBEDDING_WORKER_MAX_MEMORY_KB:-1500000}'
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import sys, os; sys.exit(0 if os.path.exists(\"/proc/1\") else 1)'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    env_file: .env
    environment:
      <<: *api-env
      PROMETHEUS_MULTIPROC_DIR: /tmp/prom
      METRICS_PORT: "9103"
      OCX_SERVICE: embedding-worker
    depends_on: *after-setup
    volumes: *api-volumes
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    image: ${OPENCORTYX_IMAGE_PREFIX:-ghcr.io/opencortyx/opencortyx}-web:${OPENCORTYX_VERSION:-dev}
    restart: unless-stopped
    logging: *logging
    mem_limit: ${WEB_MEM_LIMIT:-512m}
    memswap_limit: ${WEB_MEM_LIMIT:-512m}
    ports:
      - "${OPENCORTYX_BIND:-127.0.0.1}:${OPENCORTYX_WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      API_INTERNAL_URL: http://api:8000
      AUTH_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is not set - run bin/opencortyx init}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is not set - run bin/opencortyx init}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/auth/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  mcp:
    build: ./apps/mcp
    image: ${OPENCORTYX_IMAGE_PREFIX:-ghcr.io/opencortyx/opencortyx}-mcp:${OPENCORTYX_VERSION:-dev}
    restart: unless-stopped
    logging: *logging
    mem_limit: ${MCP_MEM_LIMIT:-192m}
    memswap_limit: ${MCP_MEM_LIMIT:-192m}
    command: python server.py
    ports:
      - "${OPENCORTYX_BIND:-127.0.0.1}:${OPENCORTYX_MCP_PORT:-8001}:8001"
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8001"
      MCP_ALLOW_ANONYMOUS: ${MCP_ALLOW_ANONYMOUS:-false}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-127.0.0.1:*,localhost:*,[::1]:*,mcp:*}
      OPENCORTYX_API_URL: http://api:8000
      OPENCORTYX_API_KEY: ${OPENCORTYX_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  nebula_meta_data:
  nebula_storage_data:
  model_cache:
  uploads:
