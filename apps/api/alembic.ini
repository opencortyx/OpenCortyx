# Alembic config for the OpenCortyx v2 store (Postgres + pgvector, schema `opencortyx_v2`).
# The DB URL is NOT hard-coded here — env.py reads it from the app settings (DATABASE_URL) and
# coerces it to the sync psycopg2 driver. Usage:
#   alembic -c apps/api/alembic.ini revision --autogenerate -m "describe change"
#   alembic -c apps/api/alembic.ini upgrade head
#   alembic -c apps/api/alembic.ini stamp head      # mark an existing (create_all'd) DB at baseline
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
