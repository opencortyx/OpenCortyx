name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # the Release workflow runs these checks on the tagged commit before publishing

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.7
      - name: Ruff (syntax errors + the full pyflakes set)
        # --select on the command line, not from pyproject: apps/mcp and scripts/ sit outside
        # apps/api, so they would otherwise resolve ruff's defaults instead of ours.
        run: ruff check --select E9,F apps/api/opencortyx apps/api/tests apps/api/alembic apps/mcp scripts
      - name: Types (domain + kernel)
        run: |
          pip install mypy==1.10.0 pydantic==2.9.2
          # The app's libraries are not installed here. --ignore-missing-imports covers most of them;
          # import-untyped is what mypy reports instead for libraries it knows stub packages for (redis).
          mypy --ignore-missing-imports --disable-error-code import-untyped \
            apps/api/opencortyx/domain apps/api/opencortyx/core
      - name: Versions match VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          grep -q "^version = \"$version\"" apps/api/pyproject.toml
          grep -q "\"version\": \"$version\"" apps/web/package.json
          grep -q "__version__ = \"$version\"" apps/api/opencortyx/__init__.py

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: opencortyx
          POSTGRES_PASSWORD: opencortyx
          POSTGRES_DB: opencortyx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opencortyx"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://opencortyx:opencortyx@localhost:5432/opencortyx
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      JWT_SECRET: ci-only-secret
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      # The API's dependencies (torch above all) nearly fill the runner's disk, and the audit step
      # then fails with "No space left on device". Drop preinstalled toolchains this job never uses.
      - name: Free disk space
        working-directory: .
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install poetry==1.8.2
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-root
      - name: Bootstrap schema
        run: |
          python -c "import asyncio, opencortyx.bootstrap as b; asyncio.run(b.init_v2_schema())"
          alembic upgrade head
      - name: Unit tests
        # Each failing test is also an annotation, which anyone can read on the run without its log.
        run: |
          set +e
          python -m pytest -q -p no:cacheprovider -rfE 2>&1 | tee /tmp/pytest.log
          status=${PIPESTATUS[0]}
          grep -E '^(FAILED|ERROR) ' /tmp/pytest.log | head -20 | sed 's/^/::error title=pytest::/'
          exit $status
      - name: Dependency audit
        run: |
          poetry export --with dev --without-hashes -f requirements.txt -o /tmp/requirements-audit.txt
          pip install pip-audit
          # Accepted advisories, each with its reason and when to drop it: pip-audit-ignore.txt.
          pip-audit -r /tmp/requirements-audit.txt --no-deps --disable-pip \
            $(grep -vE '^\s*(#|$)' pip-audit-ignore.txt | sed 's/^/--ignore-vuln /')

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.lock
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.lock
      - run: python -m compileall -q .
      - run: python -c "import server"
        env:
          MCP_TRANSPORT: stdio

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=critical
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # The web image built natively on ARM, as the Release workflow builds it. The emulated arm64 build
  # of this image hung or failed in two releases while the plain `npm run build` above passed, so a
  # release is only as safe as this check: it runs on every push, before anything is tagged.
  web-image-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: apps/web
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=web-arm64
          cache-to: type=gha,mode=max,scope=web-arm64

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate configuration
        run: bin/opencortyx init
      - name: Validate compose files
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet
      - name: Memory guards
        run: |
          pip install pytest pyyaml httpx
          python -m pytest -q -p no:cacheprovider apps/api/tests/test_memory_guards.py
      - name: Shell scripts
        run: shellcheck -S warning bin/opencortyx install.sh
      - name: PowerShell scripts
        shell: pwsh
        run: |
          foreach ($f in @("bin/opencortyx.ps1", "install.ps1")) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors; exit 1 }
          }

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The shell scripts on macOS: /bin/bash 3.2 and BSD tools, where Linux-only syntax and options
  # break. GitHub's Mac runners have no Docker, so this covers the scripts, not a running stack.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tools
        run: /bin/bash --version | head -1; sw_vers -productVersion
      - name: Syntax
        run: /bin/bash -n bin/opencortyx && /bin/bash -n install.sh
      - name: version
        run: test "$(/bin/bash bin/opencortyx version)" = "$(tr -d ' \r\n' < VERSION)"
      - name: init writes secrets once and keeps them
        run: |
          OPENCORTYX_CHANNEL=beta /bin/bash bin/opencortyx init
          for key in POSTGRES_PASSWORD JWT_SECRET NEXTAUTH_SECRET; do grep -qE "^$key=.+" .env; done
          grep -q '^OPENCORTYX_CHANNEL=beta$' .env
          before="$(grep -E '^(POSTGRES_PASSWORD|JWT_SECRET|NEXTAUTH_SECRET)=' .env)"
          /bin/bash bin/opencortyx init
          [ "$before" = "$(grep -E '^(POSTGRES_PASSWORD|JWT_SECRET|NEXTAUTH_SECRET)=' .env)" ]
      - name: Release picking (installer's sort, CLI's git sort)
        run: |
          awk '/^newest_tag\(\) \{/,/^}/' install.sh > /tmp/installer.sh
          awk '/^newest_tag\(\) \{/,/^}/; /^release_tag\(\) \{/,/^}/' bin/opencortyx > /tmp/cli.sh
          /bin/bash -euo pipefail -c '
            source /tmp/installer.sh
            stable="^v[0-9]+\.[0-9]+\.[0-9]+$"; beta="^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$"
            check() { [ "$2" = "$3" ] && echo "ok   $1: $2" || { echo "FAIL $1: got \"$2\", want \"$3\""; exit 1; }; }
            tags="v0.1.0-beta.1 v0.1.0-beta.2 v0.1.0-beta.10"
            check "installer, betas only, stable" "$(printf "%s\n" $tags | newest_tag "$stable")" ""
            check "installer, betas only, beta"   "$(printf "%s\n" $tags | newest_tag "$beta")" "v0.1.0-beta.10"
            check "installer, stable beats its betas" "$(printf "%s\n" $tags v0.1.0 | newest_tag "$beta")" "v0.1.0"
            check "installer, next beta beats stable" "$(printf "%s\n" $tags v0.1.0 v0.2.0-beta.1 | newest_tag "$beta")" "v0.2.0-beta.1"
            git init -q /tmp/tags && cd /tmp/tags
            git -c user.name=t -c user.email=t@t commit -q --allow-empty -m x
            for t in v0.1.0-beta.1 v0.1.0-beta.2 v0.1.0-beta.10 v0.1.0 v0.2.0-beta.1; do git tag "$t"; done
            source /tmp/cli.sh
            check "cli, stable channel" "$(release_tag stable)" "v0.1.0"
            check "cli, beta channel"   "$(release_tag beta)" "v0.2.0-beta.1"
            check "cli, newer of stable and next beta" "$(newest_tag v0.1.0 v0.2.0-beta.1)" "v0.2.0-beta.1"
            check "cli, stable newer than its beta" "$(newest_tag v0.1.0 v0.1.0-beta.2)" "v0.1.0"
          '
      - name: Installer explains a missing Docker
        run: |
          # A copy in an empty folder, with Docker off PATH: it must stop at its first check and never
          # install, even on a machine that has Docker.
          dir="$(mktemp -d)"; cp install.sh "$dir/"; cd "$dir"
          if out="$(PATH=/usr/bin:/bin /bin/bash ./install.sh 2>&1)"; then echo "$out"; exit 1; fi
          echo "$out"; echo "$out" | grep -q "Install Docker first"
