name: Release

# A tag picks the channel:
#   vX.Y.Z          stable  images :X.Y.Z and :latest, a normal GitHub release
#   vX.Y.Z-beta.N   beta    images :X.Y.Z-beta.N and :beta, a GitHub pre-release
#   vX.Y.Z-<other>  (alpha, rc, ...) images :X.Y.Z-<other> only, a GitHub pre-release
# Tags are immutable: never move or reuse one, release the next number instead.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      channel: ${{ steps.resolve.outputs.channel }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version and channel
        id: resolve
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$(tr -d ' \r\n' < VERSION)" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION $(cat VERSION)" >&2
            exit 1
          fi
          # bin/opencortyx builds from source for any version containing "dev", so a release
          # named that way would never use the images published here.
          case "$version" in
            *dev*) echo "Release versions must not contain 'dev': $version" >&2; exit 1 ;;
          esac
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            channel=latest prerelease=false
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            channel=beta prerelease=true
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.]+$ ]]; then
            channel= prerelease=true
          else
            echo "Not a release version: $version (expected X.Y.Z or X.Y.Z-beta.N)" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  # The same checks as every pull request, on the tagged commit: nothing is published unless they pass.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Each image is built NATIVELY for each architecture: amd64 on an Intel runner, arm64 on GitHub's
  # ARM runner. Building arm64 on an Intel runner meant QEMU emulation, and the web image's emulated
  # build hung until the 6-hour job limit in two of three releases (0.1.0-beta.3 and beta.5). Each job
  # pushes its image by digest only; `manifests` then tags the pair as one multi-architecture image.
  images:
    needs: [version, ci]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        name: [api, web, mcp]
        arch: [amd64, arm64]
        include:
          - { name: api, context: apps/api }
          - { name: web, context: apps/web }
          - { name: mcp, context: apps/mcp }
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7

      # The API image (torch, Docling) needs more room than the runner has free.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/opencortyx-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: ${{ matrix.context }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.arch }}

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir -p /tmp/digests && touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.name }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifests:
    needs: [version, images]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        name: [api, web, mcp]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the amd64 + arm64 pair
        working-directory: /tmp/digests
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/opencortyx-${{ matrix.name }}"
          [ "$(ls | wc -l)" -eq 2 ] || { echo "::error::expected 2 digests (amd64, arm64), got: $(ls)"; exit 1; }
          tags=(-t "$image:$VERSION")
          [ -z "$CHANNEL" ] || tags+=(-t "$image:$CHANNEL")
          docker buildx imagetools create "${tags[@]}" $(printf "$image@sha256:%s " *)
          docker buildx imagetools inspect "$image:$VERSION"

  github-release:
    needs: [version, manifests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Release notes from CHANGELOG
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then kind=--prerelease; else kind=--latest; fi
          gh release create "$GITHUB_REF_NAME" --verify-tag "$kind" \
            --title "OpenCortyx $GITHUB_REF_NAME" --notes-file notes.md
