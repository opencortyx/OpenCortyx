name: Bug report
description: Something does not work as it should.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: One problem per report, please. Remove passwords, API keys and private data from anything you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, and what went wrong.
      placeholder: I uploaded a 40-page PDF in Add data; the run stayed at "Parsing" for an hour.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Add data
        2. Upload report.pdf with the Unstructured pipeline
        3. Open Runs
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenCortyx version
      description: Output of `bin/opencortyx version`.
      placeholder: 0.1.0-beta.2
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 / macOS 15 / Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Doctor output and logs
      description: Output of `bin/opencortyx doctor`, and the relevant lines of `bin/opencortyx logs api`.
      render: text
