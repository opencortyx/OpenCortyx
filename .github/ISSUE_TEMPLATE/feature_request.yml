name: Feature request
description: Suggest a new capability or an improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What you are trying to do, and why it is hard or impossible today.
      placeholder: I keep data in Snowflake and cannot connect it without installing drivers by hand.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you would like OpenCortyx to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
